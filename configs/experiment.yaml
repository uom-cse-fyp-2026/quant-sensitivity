# NeuroMinds quantization sensitivity experiment. Plan: docs/experiment_plan.md.

experiment:
  name: neurominds-quant-sensitivity
  objective: >-
    Show how operator error depends on the input distribution and the quantization scheme,
    and verify that reduction ops are more sensitive than elementwise ops.

environment:
  device: cpu
  num_threads: 1
  deterministic_algorithms: true

seeds:
  # Per-sample seed: int(sha256(f"{regime}|{sample_id}").hexdigest()[:16], 16)
  sample_seed_hex_digits: 16
  bootstrap_seed: 20261017

vector_length: 1024
samples_per_regime: 300

operators:
  sum: {kind: reduction, call: "x.sum(dim=-1)"}
  softmax: {kind: reduction, call: "torch.softmax(x, dim=-1)"}
  layer_norm: {kind: reduction, call: "F.layer_norm(x, (n,), weight=None, bias=None, eps=1e-5)"}
  gelu: {kind: elementwise, call: "F.gelu(x, approximate='none')"}   # control for the assertion

regimes:
  D0: {name: normal}
  D1:
    name: random outliers
    outlier_rate: 0.01          # exactly round(rate * n) positions, overwritten with ±magnitude
    outlier_magnitude: 20.0     # signs balanced: k // 2 each way
  D2: {name: near-constant, offset: 1.0, noise_std: 0.001}
  D3: {name: cancellation, sigma_delta: 0.01}   # n/2 values a ~ N(0,1) paired with -a + delta
  D4: {name: heavy-tailed, df: 3}               # Student-t(df) / sqrt(df / (df - 2))
  D5:
    name: fixed outlier channels
    n_channels: 8
    channel_magnitude: 20.0     # x[c] = sign_c * 20 + N(0, 1); 4 positive, 4 negative
    channel_seed: 20261015      # same positions and signs in every sample

quantizers:
  # Signed, symmetric, uniform, round-half-even, saturating, zero point 0.
  # Scale = absmax / qmax of the input itself (per tensor or per group), floor 1e-12.
  Q0: {label: A8 per-tensor, bits: 8, group_size: null}
  Q1: {label: A4 per-tensor, bits: 4, group_size: null}
  Q2: {label: A4 per-group-32, bits: 4, group_size: 32}

metrics:
  # Computed in FP64 against the FP32 NoQuant baseline.
  probability_clamp: 1.0e-12     # KL on clamped, renormalised distributions
  norm_l2_eps: 1.0e-12
  kappa_null_ref_norm: 1.0e-12
  fp32_noise_factor: 1000        # at_fp32_noise when output relative error <= 1000 x fp32_noise
  headline:                      # one error measure per operator for tables and the heatmap
    sum: l1_norm_error
    softmax: softmax_kl
    layer_norm: norm_l2
    gelu: norm_l2

analysis:
  bootstrap_resamples: 2000
  ci_level: 0.95
